<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Catalog — Squad Sample Pages</title>
<style>
  :root { --accent:#54a7ff; --green:#41d38b; --amber:#f5b942; --muted:#9aa8b3; --panel:#121820; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0d1216; color:#e8eef2; }
  header { padding: 40px 20px 10px; text-align:center; }
  header p { color: var(--muted); margin:6px 0 0; }
  main { max-width: 1000px; margin:0 auto; padding: 20px 20px 60px; }
  .toolbar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .toolbar input, .toolbar select { padding:10px 14px; border-radius:10px; border:1px solid rgba(242,245,247,.16); background: var(--panel); color:#e8eef2; font:inherit; }
  .toolbar input { flex:1; min-width:200px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:16px; }
  .item { background: var(--panel); border:1px solid rgba(242,245,247,.1); border-radius:12px; padding:18px; cursor:pointer; text-decoration:none; color:inherit; display:block; }
  .item h3 { margin:0 0 6px; }
  .item p { margin:0 0 10px; color: var(--muted); font-size:.84rem; }
  .tag { display:inline-block; font-size:.7rem; padding:3px 8px; border-radius:999px; background: rgba(84,167,255,.14); color: var(--accent); }
  .empty { color: var(--muted); text-align:center; padding: 40px 0; display:none; }
</style>
</head>
<body>
<header><h1>IT Equipment Catalog</h1><p>Browse available hardware and software licenses to request.</p></header>
<main>
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search items…" aria-label="Search items">
    <select id="categoryFilter" aria-label="Filter by category">
      <option value="">All categories</option>
      <option value="Hardware">Hardware</option>
      <option value="Software">Software</option>
      <option value="Accessories">Accessories</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState">No items match your filters.</div>
</main>
<script>
  const ITEMS = [
    { id: "laptop-14", name: "14\" Developer Laptop", category: "Hardware", desc: "16GB RAM, 512GB SSD, pre-configured dev image." },
    { id: "monitor-27", name: "27\" 4K Monitor", category: "Hardware", desc: "USB-C, 60Hz, height adjustable stand." },
    { id: "ide-license", name: "IDE Pro License", category: "Software", desc: "1-year seat for the team's preferred IDE." },
    { id: "vpn-token", name: "VPN Hardware Token", category: "Accessories", desc: "Physical 2FA token for remote access." },
    { id: "headset", name: "Noise-Cancelling Headset", category: "Accessories", desc: "For calls and focus time." },
    { id: "design-license", name: "Design Suite License", category: "Software", desc: "1-year seat for the design toolset." }
  ];
  const grid = document.getElementById("grid");
  const emptyState = document.getElementById("emptyState");
  const searchInput = document.getElementById("searchInput");
  const categoryFilter = document.getElementById("categoryFilter");

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const cat = categoryFilter.value;
    const filtered = ITEMS.filter((i) =>
      (!q || i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)) &&
      (!cat || i.category === cat)
    );
    grid.innerHTML = filtered.map((i) => `
      <a class="item" href="it-item-detail.html?id=${encodeURIComponent(i.id)}">
        <span class="tag">${i.category}</span>
        <h3>${i.name}</h3>
        <p>${i.desc}</p>
      </a>
    `).join("");
    emptyState.style.display = filtered.length === 0 ? "block" : "none";
  }

  searchInput.addEventListener("input", render);
  categoryFilter.addEventListener("change", render);
  render();
</script>
</body>
</html>
